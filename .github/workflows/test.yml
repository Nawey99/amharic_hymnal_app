# .github/workflows/test.yml
name: Tests and Linting

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, flutter-app ]
  pull_request:
    branches: [ main, flutter-app ]

jobs:
  dependency-vulnerabilities:
    name: Scan Dependency Advisories
    # The reusable workflow declares these; a called workflow cannot be
    # granted more than its caller, so without them the run fails to start.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: false

  repository-security:
    name: Scan Repository Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Scan tracked files and Git history
        run: node tool/security_scan.mjs

      - name: Scan full history with TruffleHog
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/trufflesecurity/trufflehog@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577
          git file:///repo
          --fail
          --no-update
          --no-verification
          --exclude-paths=/repo/.github/trufflehog-exclude.txt

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: dart analyze

      # Unit, widget, contract and failure tests (test/). Never touches the
      # live API; the nightly workflow covers that (test_live/).
      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce minimum coverage
        run: dart run tool/coverage_gate.dart ${{ vars.COVERAGE_MINIMUM || '80' }}

      - name: Keep coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Build self-hosted web release
        run: flutter build web --release --no-web-resources-cdn

      # libcurl: sentry_flutter's native Linux client sends reports with curl.
      - name: Install Linux integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config \
            xvfb

      # Point content at an unreachable host so the run never depends on the
      # live hymnal API; the app falls back to its bundled hymns.
      - name: Run integration tests
        run: >-
          xvfb-run --auto-servernum flutter test integration_test/app_test.dart -d linux
          --dart-define=WUDASE_CONTENT_API_URL=https://content.example.invalid

  android-emulator:
    name: Full-App Tests on Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 24 is minSdk (Android 7); 36 is the Play target (Android 16:
        # mandatory edge-to-edge and predictive back).
        api-level: [24, 36]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Deterministic: scripted content, everything else unreachable.
      - name: Run integration tests on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            flutter test integration_test/app_test.dart
            --dart-define=WUDASE_CONTENT_API_URL=https://content.example.invalid

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run linter
        run: flutter analyze

      - name: Check formatting
        run: dart format --set-exit-if-changed .
