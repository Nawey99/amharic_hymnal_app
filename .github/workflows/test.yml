# .github/workflows/test.yml
name: Tests and Linting

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, flutter-app ]
  pull_request:
    branches: [ main, flutter-app ]

jobs:
  dependency-vulnerabilities:
    name: Scan Dependency Advisories
    # The reusable workflow declares these; a called workflow cannot be
    # granted more than its caller, so without them the run fails to start.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: false

  repository-security:
    name: Scan Repository Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Scan tracked files and Git history
        run: node tool/security_scan.mjs

      - name: Scan full history with TruffleHog
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/trufflesecurity/trufflehog@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577
          git file:///repo
          --fail
          --no-update
          --no-verification
          --exclude-paths=/repo/.github/trufflehog-exclude.txt

  # App Store Connect only accepts builds made with Xcode 26 (since
  # 2026-04-28) targeting iOS 13 or later (since 2026-09-09). This compiles
  # the iOS app the way an upload would be built, minus signing, so either
  # requirement breaking shows up here rather than on the release Mac.
  ios-build:
    name: Build iOS (unsigned, Xcode 26)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this runner; App Store uploads require it."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: dart analyze

      # Unit, widget, contract and failure tests (test/). Never touches the
      # live API; the nightly workflow covers that (test_live/).
      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce minimum coverage
        run: dart run tool/coverage_gate.dart ${{ vars.COVERAGE_MINIMUM || '80' }}

      - name: Keep coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Android release bundle
        run: flutter build appbundle --release

      - name: Build self-hosted web release
        run: flutter build web --release --no-web-resources-cdn

      # libcurl: sentry_flutter's native Linux client sends reports with curl.
      - name: Install Linux integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config \
            xvfb

      # Point content at an unreachable host so the run never depends on the
      # live hymnal API; the app falls back to its bundled hymns.
      - name: Run integration tests
        run: >-
          xvfb-run --auto-servernum flutter test integration_test/app_test.dart -d linux
          --timeout 25m
          --dart-define=WUDASE_CONTENT_API_URL=https://content.example.invalid

  android-emulator:
    name: Full-App Tests on Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 36 is the Play target (Android 16: mandatory edge-to-edge and
        # predictive back). minSdk 24 is covered nightly instead: on a
        # free runner that image needs eleven minutes just to install and
        # start the app, and Flutter allows twelve for the whole load,
        # so on a pull request it fails on the clock rather than on the
        # code.
        api-level: [36]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Flutter allows a test twelve minutes to load, and loading one on
      # a device means building, installing and starting the app. That
      # cannot be raised from here (--timeout governs the test, not the
      # load), so the build has to be quick instead: the caches below
      # save the five minutes a cold runner spends fetching the NDK and
      # compiling from nothing.
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache the Android SDK build pieces
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: android-sdk-${{ runner.os }}-ndk26-cmake322
          restore-keys: android-sdk-${{ runner.os }}-

      # Built here rather than inside the emulator step, where it would
      # count against the test's own clock.
      - name: Warm the Android build
        run: flutter build apk --debug --target-platform android-x64

      # Deterministic: scripted content, everything else unreachable.
      - name: Run integration tests on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            flutter test integration_test/app_test.dart --timeout 25m
            --dart-define=WUDASE_CONTENT_API_URL=https://content.example.invalid

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run linter
        run: flutter analyze

      - name: Check formatting
        run: dart format --set-exit-if-changed .
