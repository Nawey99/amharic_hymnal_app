# .github/workflows/nightly.yml
#
# Tests that need the outside world, run nightly and on demand, never on
# every push:
#   - live-api:      test_live/ against the production hymnal API (read-only)
#   - oldest-android: integration_test/app_test.dart on minSdk 24, which
#                     is too slow to install inside the twelve minutes a
#                     pull request allows
#
# Native (Patrol) flows are run by hand on a real phone before a release;
# there is no cloud device farm.
# See docs/test-plan.md → "Where each test runs".
name: Nightly Device and Live Checks

permissions:
  contents: read

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC = 04:30 in Ethiopia
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-api:
    name: Live Hymnal API Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check production content and contract
        run: flutter test test_live

  oldest-android:
    name: Full-App Tests on Android 24
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Warm the Android build
        run: flutter build apk --debug --target-platform android-x64

      # Room to breathe: this image spends minutes installing and
      # starting the app, and nothing here is racing a reviewer.
      - name: Run integration tests on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          disable-animations: true
          script: >-
            flutter test integration_test/app_test.dart --timeout 25m
            --dart-define=WUDASE_CONTENT_API_URL=https://content.example.invalid
