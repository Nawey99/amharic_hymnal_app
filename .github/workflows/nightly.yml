# .github/workflows/nightly.yml
#
# Tests that need the outside world, run nightly and on demand, never on
# every push:
#   - live-api: test_live/ against the production hymnal API (read-only)
#
# Native (Patrol) flows are run by hand on a real phone before a release;
# there is no cloud device farm.
# See docs/test-plan.md → "Where each test runs".
name: Nightly Device and Live Checks

permissions:
  contents: read

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC = 04:30 in Ethiopia
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-api:
    name: Live Hymnal API Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check production content and contract
        run: flutter test test_live
