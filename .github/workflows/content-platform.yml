name: Content Platform

permissions:
  contents: read

on:
  push:
    branches: [flutter-app]
    paths:
      - ".github/workflows/content-platform.yml"
      - ".dockerignore"
      - "assets/fonts/**"
      - "backend/content/**"
      - "render.yaml"
      - "tool/security_scan.mjs"
  pull_request:
    branches: [main, flutter-app]
    paths:
      - ".github/workflows/content-platform.yml"
      - ".dockerignore"
      - "assets/fonts/**"
      - "backend/content/**"
      - "render.yaml"
      - "tool/security_scan.mjs"

concurrency:
  group: content-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Content Platform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/content/package-lock.json

      - name: Install dependencies
        working-directory: backend/content
        run: npm ci

      - name: Check backend
        working-directory: backend/content
        run: npm run check

      - name: Validate Prisma schema
        working-directory: backend/content
        env:
          CONTENT_DATABASE_URL: postgresql://validation:validation@localhost:5432/validation
        run: npx prisma validate

      - name: Audit production dependencies
        working-directory: backend/content
        run: npm audit --omit=dev

      - name: Scan repository for secrets
        run: node tool/security_scan.mjs

      - name: Build production container
        run: docker build --file backend/content/Dockerfile --tag wudase-content:ci .
